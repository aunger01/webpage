<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="robots" content="noindex">

<title>站点目录树 · Aunger</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-ico.png">
<style>
:root{--bg1:#0b1026;--bg2:#141b3d;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--txt:#e8ecff;--sub:#9aa7d6;--accent:#7c9bff;--green:#6fd3a5}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--txt);
background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,#1a2350 100%);padding:36px 16px 48px}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:24px;font-weight:600;letter-spacing:1px}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:6px;letter-spacing:0}
.toolbar{display:flex;gap:8px;align-items:center}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--txt);
padding:7px 14px;border-radius:10px;font-size:13px;transition:.2s;backdrop-filter:blur(6px)}
button:hover{border-color:var(--accent);color:#fff;background:rgba(124,155,255,.18)}
#status{font-size:12px;color:var(--sub)}
#status.ok{color:var(--green)}
#status.err{color:#ff8a8a}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;
backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.35)}
tree-root{display:block;font-size:14px;line-height:1.9}
details{padding-left:18px;border-left:1px dashed rgba(255,255,255,.12);margin-left:6px}
details.top{padding-left:0;border-left:none;margin-left:0}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:2px 6px;border-radius:8px;user-select:none}
summary::-webkit-details-marker{display:none}
summary:hover{background:rgba(124,155,255,.12)}
summary .chev{transition:.18s;color:var(--sub);font-size:11px;width:12px;flex:none}
details[open]>summary .chev{transform:rotate(90deg)}
.folder{color:#ffd479}
.go{font-size:12px;color:var(--accent);text-decoration:none;margin-left:2px;flex:none}
.go:hover{text-decoration:underline;color:#a8c1ff}
.leaf{display:flex;align-items:center;gap:8px;padding:2px 6px 2px 20px;margin-left:6px;border-radius:8px}
.leaf:hover{background:rgba(124,155,255,.12)}
a{color:var(--txt);text-decoration:none}
a:hover{color:var(--accent);text-decoration:underline}
.note{font-size:12px;color:var(--sub);background:rgba(124,155,255,.14);border:1px solid rgba(124,155,255,.25);
padding:1px 8px;border-radius:99px;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.size{font-size:11px;color:var(--sub);margin-left:auto;flex:none}
footer{margin-top:18px;text-align:center;font-size:12px;color:var(--sub);opacity:.75}
footer a{color:var(--sub)}
@media(max-width:600px){h1{font-size:20px}.card{padding:14px 12px}tree-root{font-size:13px}.leaf{padding-left:12px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🌳 站点目录树<small>l1n2.com 全站结构一览 · 点击目录展开 / 点击文件直达</small></h1>
<div class="toolbar">
<button id="btn-expand" title="展开全部目录">⊞ 展开</button>
<button id="btn-collapse" title="收起全部目录">⊟ 收起</button>
<button id="btn-sync" title="从 GitHub 拉取最新仓库结构">🔄 同步最新</button>
</div>
</header>
<div class="card"><tree-root id="tree"></tree-root></div>
<p id="status">静态视图 · commit afddb50 · 共 25 个页面</p>
<footer>© 2020-2026 Aunger · <a href="/">← 返回主页</a></footer>
</div>

<script>
var BASE="https://l1n2.com/",REPO_API="https://api.github.com/repos/aunger01/webpage/git/trees/master?recursive=1";
var NOTES={"index.html":"主页","index1.html":"本页 · 站点目录树","css":"主页样式","assets":"主页静态资源","app":"源码子站","app/help":"「你不会百度吗」恶搞子站","app/xjj":"随机视频子站","app/mp4":"离线视频重封装工具","github":"跳转页 → github.testing.ccwu.cc","github-top":"跳转页 → GitHub 中文项目榜","google":"跳转页 → Google Play 镜像","gpt":"跳转页 → cc.ai55.cc","md":"跳转页 → Markdown 编辑器","my":"跳转页 → 聚合导航书签","pi":"跳转页 → Pi Day","resume":"跳转页 → D&D 简历编辑器","sbti":"跳转页 → SBTI","puabook":"跳转页 → PUA 书目","univ":"跳转页 → 大学资料网盘","help":"兜底跳转 → app/help","mp4":"兜底跳转 → app/mp4","404.html":"404 页面"};
var ICON={html:"📄",css:"🎨",js:"⚙️",png:"🖼️",gif:"🖼️",webp:"🖼️",jpg:"🖼️",jpeg:"🖼️",ico:"🔷",md:"📝",txt:"📃",CNAME:"🏷️"};
function fmtSize(n){if(n==null)return"";if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";return(n/1048576).toFixed(2)+" MB"}
function icon(name,isDir){if(isDir)return"📁";var i=name.lastIndexOf(".");var ext=i<0?name:name.slice(i+1);return ICON[ext]||"📄"}
function isDir(v){return v!==null&&typeof v==="object"}

function render(tree,el,topLevel){
  var keys=Object.keys(tree).sort(function(a,b){
    var da=isDir(tree[a]),db=isDir(tree[b]);
    if(da!==db)return da?-1:1;return a.localeCompare(b)});
  keys.forEach(function(name){
    var v=tree[name],path=topLevel?topLevel+"/"+name:name,note=NOTES[path];
    if(isDir(v)){
      var d=document.createElement("details");
      if(!topLevel)d.className="top",d.open=true;
      var s=document.createElement("summary");
      var hasIdx=v["index.html"]!==undefined&&!isDir(v["index.html"]);
      var label=document.createElement("span");
      label.className="name folder";
      label.textContent=icon(name,true)+" "+name;
      s.appendChild(Object.assign(document.createElement("span"),{className:"chev",textContent:"▶"}));
      s.appendChild(label);
      if(hasIdx){
        var go=document.createElement("a");
        go.href=BASE+path+"/";go.target="_blank";go.rel="noopener";
        go.className="go";go.textContent="↗";go.title="新标签页打开 "+BASE+path+"/";
        s.appendChild(go);
      }
      if(note)s.appendChild(Object.assign(document.createElement("span"),{className:"note",textContent:note}));
      d.appendChild(s);render(v,d,path);el.appendChild(d);
    }else{
      var leaf=document.createElement("div");leaf.className="leaf";
      var a=document.createElement("a");a.href=BASE+path;a.target="_blank";a.rel="noopener";a.textContent=icon(name,false)+" "+name;
      leaf.appendChild(a);
      if(note)leaf.appendChild(Object.assign(document.createElement("span"),{className:"note",textContent:note}));
      leaf.appendChild(Object.assign(document.createElement("span"),{className:"size",textContent:fmtSize(v)}));
      el.appendChild(leaf);
    }
  });
}
var data=JSON.parse(document.getElementById("tree-data").textContent);
var tree=document.getElementById("tree");render(data,tree,"");

document.getElementById("btn-expand").onclick=function(){document.querySelectorAll("details").forEach(function(d){d.open=true})};
document.getElementById("btn-collapse").onclick=function(){document.querySelectorAll("details").forEach(function(d){d.open=false})};

var statusEl=document.getElementById("status"),syncBtn=document.getElementById("btn-sync");
syncBtn.onclick=function(){
  syncBtn.disabled=true;statusEl.className="";statusEl.textContent="⏳ 正在从 GitHub 同步最新结构…";
  fetch(REPO_API).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);return r.json();
  }).then(function(j){
    if(!j.tree)throw new Error("bad payload");
    var root={},count=0;
    j.tree.forEach(function(e){
      if(e.truncated)return;
      if(e.type!=="tree"&&!/\.html?$/i.test(e.path))return;
      var parts=e.path.split("/"),node=root;
      for(var i=0;i<parts.length-1;i++)node=node[parts[i]]=node[parts[i]]||{};
      node[parts[parts.length-1]]=e.type==="tree"?{}:e.size;
      if(e.type!=="tree")count++;
    });
    (function prune(o){for(var k in o){if(typeof o[k]==="object"){prune(o[k]);if(Object.keys(o[k]).length===0)delete o[k];}}})(root);
    tree.innerHTML="";render(root,tree,"");
    statusEl.className="ok";statusEl.textContent="✅ 已同步 GitHub 最新结构 · 共 "+count+" 个页面";
  }).catch(function(e){
    statusEl.className="err";statusEl.textContent="⚠️ 同步失败（"+e.message+"），已保留静态视图";
  }).finally(function(){syncBtn.disabled=false});
};
</script>
</body>
</html>
