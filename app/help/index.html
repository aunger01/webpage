<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="让我帮你搜一下！百度 / 必应 / 谷歌，一键生成搜索链接">
    <link rel="apple-touch-icon" href="./app-ico-2.png">
    <link rel="shortcut icon" href="./app-ico-2.png">
    <meta property="og:image" content="./app-ico-2.png">
    <title>让我帮你搜一下！</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 55%, #0c4a6e 100%);
            color: #e2e8f0;
            padding: 32px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .wrap { text-align: center; max-width: 720px; width: 100%; }

        .logo {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(56, 189, 248, .35);
            animation: float 5s ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            margin: 28px 0 10px;
            font-size: clamp(26px, 5vw, 40px);
            letter-spacing: 2px;
            background: linear-gradient(90deg, #7dd3fc, #a5b4fc, #7dd3fc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 6s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .sub { color: #94a3b8; font-size: 15px; line-height: 1.8; }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin: 40px 0 8px;
        }

        .card {
            display: block;
            padding: 26px 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .1);
            backdrop-filter: blur(8px);
            text-decoration: none;
            color: inherit;
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
        }
        .card:hover, .card:focus-visible {
            transform: translateY(-6px);
            border-color: var(--accent, #7dd3fc);
            box-shadow: 0 14px 34px rgba(2, 6, 23, .5);
        }
        .card .ico { font-size: 34px; line-height: 1; }
        .card .name { display: block; margin: 12px 0 6px; font-size: 18px; font-weight: 600; }
        .card .desc { display: block; color: #94a3b8; font-size: 13px; }
        .card .go {
            display: inline-block;
            margin-top: 14px;
            font-size: 13px;
            color: var(--accent, #7dd3fc);
        }

        .baidu   { --accent: #4f7cff; }
        .bing    { --accent: #2dd4bf; }
        .google  { --accent: #fbbf24; }

        .foot {
            margin-top: 36px;
            color: #64748b;
            font-size: 13px;
        }
        .foot a { color: #94a3b8; text-decoration: none; }
        .foot a:hover { color: #7dd3fc; }
    </style>
</head>

<body>
    <div class="wrap">
        <img src="app-ico-2.png" class="logo" alt="logo">
        <h1>让我帮你搜一下！</h1>
        <p class="sub">总有人张口就问、不肯动手搜？<br>挑一个引擎，把生成的链接甩给 TA。</p>

        <div class="cards">
            <a class="card baidu" href="./Baidu/index.html" target="_blank" rel="noopener noreferrer">
                <span class="ico">🔍</span>
                <span class="name">百度一下</span>
                <span class="desc">国内直达，老少皆宜</span>
                <span class="go">进入 →</span>
            </a>
            <a class="card bing" href="./Bing/index.html" target="_blank" rel="noopener noreferrer">
                <span class="ico">🌎</span>
                <span class="name">必应一下</span>
                <span class="desc">国内可用的国际引擎</span>
                <span class="go">进入 →</span>
            </a>
            <a class="card google" href="./Google/index.html" target="_blank" rel="noopener noreferrer">
                <span class="ico">🚀</span>
                <span class="name">谷歌一下</span>
                <span class="desc">搜索界的祖师爷</span>
                <span class="go">进入 →</span>
            </a>
        </div>

        <p class="foot">Powered by <a href="https://l1n2.com">L1N2.com</a> · l1n2.com/app/help</p>
    </div>
</body>

</html>
