# ============================================================
# 第 1 段 · AI 依赖的第三方（登录 / 人机验证 / 资源 / 付费）
# 说明：不纳入这一段，AI 站点大概率「能打开但登不进、或验证卡死」。
#       若某条日后造成误伤，直接删该行即可，不影响其他规则。
# ============================================================

# ---------- 1.1 Google 账号登录 + 前端资源（Gemini / ChatGPT 第三方登录用）----------
