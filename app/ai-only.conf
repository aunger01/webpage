DOMAIN-SUFFIX,googleusercontent.com,PROXY
DOMAIN-SUFFIX,recaptcha.net,PROXY

# ---------- 1.2 Cloudflare 人机挑战 / CDN（功能性，保留代理）----------
DOMAIN-SUFFIX,challenges.cloudflare.com,PROXY
DOMAIN-SUFFIX,cdn.cloudflare.net,PROXY

# ---------- 1.3 功能性端点（保留代理）----------
DOMAIN,openai-api.arkoselabs.com,PROXY
DOMAIN-SUFFIX,client-api.arkoselabs.com,PROXY
DOMAIN-SUFFIX,featuregates.org,PROXY
DOMAIN-SUFFIX,identrust.com,PROXY
# 注：auth0.com 是全互联网通用的身份服务（弱侧信道），但它属 ChatGPT 登录链路。
#     臣妾判断「登不进」的代价高于这点侧信道，故保留代理。
#     若圣上日后确认 ChatGPT 登录并不依赖它，可改 REJECT 以进一步收缩暴露面。
DOMAIN-SUFFIX,auth0.com,PROXY

# ---------- 1.4 遥测 / 追踪类（REJECT）----------
# 为什么用 REJECT 而非 PROXY：这批域名并非 AI 专属，是全互联网通用服务。
# 圣上访问直连页面时，页面内的第三方子请求一旦命中它们，就会漏给节点，
# 与「只走 AI、其余不经过代理」的目标直接冲突，故在 TCP 层直接拒绝。
# 三重收益：断追踪、不过节点、页面更快（立即失败，不必等超时）。
# 若日后发现影响 AI 站点功能，把对应行改回 PROXY 即可。
DOMAIN,static.cloudflareinsights.com,REJECT
DOMAIN-SUFFIX,statsig.com,REJECT
DOMAIN-SUFFIX,events.statsigapi.net,REJECT
DOMAIN-SUFFIX,launchdarkly.com,REJECT
DOMAIN-SUFFIX,algolia.net,REJECT
DOMAIN-SUFFIX,intercom.io,REJECT
DOMAIN-SUFFIX,intercomcdn.com,REJECT
DOMAIN-SUFFIX,segment.io,REJECT
DOMAIN-SUFFIX,sentry.io,REJECT
DOMAIN,browser-intake-datadoghq.com,REJECT
DOMAIN-SUFFIX,observeit.net,REJECT

# ---------- 1.5 实时语音（ChatGPT 高级语音 / Claude 通话）----------
