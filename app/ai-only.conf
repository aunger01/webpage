DOMAIN,appleid.cdn-apple.com,PROXY

# ============================================================
# 第 2 段 · 收尾
# 注：FINAL 已是 DIRECT，此条 GEOIP 本身不改变结果；
#     保留它是为将来若把 FINAL 改回 PROXY（恢复翻墙）时，
#     国内流量能被自动保护，无需重排规则。
# ============================================================
GEOIP,CN,DIRECT

IP-CIDR,192.168.0.0/16,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT

FINAL,DIRECT

[Host]
localhost = 127.0.0.1

[MITM]
# 本配置不做 HTTPS 解密：AI 白名单只做域名分流，不改写 URL。
# 原配置里的 URL Rewrite（bing.cn→bing.com、google.cn→google.com、
# TikTok 区域解锁）已一并移除 —— 这些站点改后均走直连，改写已无意义。
# 若圣上仍想保留 TikTok 区域解锁，臣妾可单独补回。
ca-passphrase = Shadowrocket
enable = false
